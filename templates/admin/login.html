{% extends "admin/base.html" %}
{% block title %}Staff Login{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:var(--black)">
  <form method="post" class="admin-card" style="width:100%;max-width:380px;border-top:4px solid var(--red)">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="text-center mb-4">
      <span class="brand-mark">CMC</span>
      <h4 class="mt-3 mb-0">{{ site.company_name }}</h4>
      <small class="text-muted">Staff login</small>
    </div>
    <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required autofocus></div>
    <div class="mb-4"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Login</button>
    <div class="text-center mt-3"><a href="{{ url_for('public.home') }}" class="small">&larr; Back to website</a></div>
  </form>
</div>
{% endblock %}
