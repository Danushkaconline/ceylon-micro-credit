{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h3 class="mb-4">Change Password</h3>
<form method="post" class="admin-card" style="max-width:480px">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">Current password</label><input type="password" name="current_password" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">New password (min 8 characters)</label><input type="password" name="new_password" class="form-control" required minlength="8"></div>
  <div class="mb-4"><label class="form-label">Confirm new password</label><input type="password" name="confirm_password" class="form-control" required></div>
  <button class="btn btn-primary">Change password</button>
</form>
{% endblock %}
